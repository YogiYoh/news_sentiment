version: 2

models:
  - name: gold_articles_scored
    columns:
      - name: '"link"'
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('silver_articles')
              field: '"link"'
      - name: '"headline"'
        data_tests:
          - not_null
      - name: '"source"'
        data_tests:
          - not_null
          - accepted_values:
              values: ['cnn', 'bbc', 'foxnews', 'npr', 'guardian', 'nytimes']
      - name: '"timestamp"'
        data_tests:
          - not_null
      - name: '"sentiment_score"'
        data_tests:
          - not_null
          - is_between:
              min_value: -1.0
              max_value: 1.0
  - name: gold_sentiment_by_source_daily
    columns:
      - name: '"source"'
        data_tests:
          - not_null
          - accepted_values:
              values: ['cnn', 'bbc', 'foxnews', 'npr', 'guardian', 'nytimes']
      - name: article_date
        data_tests:
          - not_null
      - name: avg_sentiment_score
        data_tests:
          - not_null
          - is_between:
              min_value: -1.0
              max_value: 1.0
      - name: total_articles
        data_tests:
          - not_null
          - is_positive
  - name: gold_sentiment_total
    columns:
      - name: '"source"'
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: ['cnn', 'bbc', 'foxnews', 'npr', 'guardian', 'nytimes']
      - name: avg_sentiment_score
        data_tests:
          - not_null
          - is_between:
              min_value: -1.0
              max_value: 1.0
      - name: total_articles
        data_tests:
          - not_null
          - is_positive
