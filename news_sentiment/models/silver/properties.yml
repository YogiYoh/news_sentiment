version: 2

models:
  - name: silver_articles
    columns:
      - name: '"link"'
        data_tests:
          - unique
          - not_null
      - name: '"headline"'
        data_tests:
            - not_null
      - name: '"source"'
        data_tests:
            - not_null
      - name: '"timestamp"'
        data_tests:
            - not_null
